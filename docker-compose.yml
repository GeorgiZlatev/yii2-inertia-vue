services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app_test
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  php:
    image: yiisoftware/yii2-php:8.5-apache-latest
    command: bash -c "ln -sfn /app/public /app/web && apache2-foreground"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: app_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TEST_DB_CONNECTION: mysql
      TEST_DB_HOST: mysql
      TEST_DB_PORT: 3306
      TEST_DB_DATABASE: app_test
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    ports:
      - "8000:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "runuser -u www-data -- sh -c 'test -w /app/runtime && test -w /app/public/assets'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
